<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">
    <h2 class="mb-3">My Tasks</h2>
    <a href="{% url 'task_add' %}" class="btn btn-success mb-3">➕ Add Task</a>
    <table class="table">
        <thead>
            <tr>
                <th>Task</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for task in tasks  %}
            <tr>
                <td>{{task.title}}</td>
                <td>
                    {% if task.completed %}
                        ✅ Completed
                    {% else %}
                        ⏳ Pending
                    {% endif %}
                </td>
                <td>
                    {% if not task.completed %}
                     <a href="{% url 'task_complete' task.pk%}" class="btn btn-primary btm-sm">Mark Completed</a>
                    {% else %}
                        <a href="{% url 'task_delete' task.pk %}" class="btn btn-danger btn-sm">Delete</a>
                    {% endif %}
                </td>
            </tr>
            {% empty %}
            <tr><td colspan="3">No tasks yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
