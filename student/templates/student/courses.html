{% extends "student/base.html" %}
{% block title %}Courses{% endblock title %}
{% block content %}
<h2>Your Courses</h2>
<table border="1" cellpadding='10 cellspacing='0>
    <tr>
        <th>Course Code</th>
        <th>Title</th>
        <th>Unit</th>
    </tr>
    {% for c in courses  %}
    <tr>
        <td>{{c.code}}</td>
        <td>{{c.title}}</td>
        <td>{{c.unit}}</td>
    </tr>
    {% endfor %}
</table>
{% endblock content %}
